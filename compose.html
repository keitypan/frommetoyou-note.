<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schreib ihm eine Nachricht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Geist:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #703e94;
    --card-bg: rgba(255,255,255,0.3);
    --card-border: rgba(255,255,255,0.2);
    --heart: rgba(112,62,148,0.1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; justify-content: center; background: #b98fe0; }
  .device {
    width: 100%;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  @media (min-width: 431px) {
    body { min-height: 100vh; padding: 20px 12px 60px; }
    .device {
      max-width: 375px;
      height: 812px;
      border-radius: 36px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 20px 50px rgba(0,0,0,0.12);
    }
  }
  .bg { position: absolute; inset: -5% -3%; z-index: -1; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .bg .blur { position: absolute; inset: 0; backdrop-filter: blur(47px); background: rgba(191,146,223,0.1); }

  .content {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    padding: calc(24px + env(safe-area-inset-top)) 16px 0;
    width: 100%; max-width: 375px; box-sizing: border-box;
    flex: 1; min-height: 0;
  }
  .heading {
    font-family: "Geist", sans-serif; font-weight: 700; font-size: 20px;
    color: var(--purple); text-align: center; margin: 0; width: 100%;
  }
  .card {
    position: relative; width: 100%; min-height: 300px; max-height: 624px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 32px 16px;
    box-shadow: 0 16px 18px rgba(145,145,145,0.1), 0 65px 32.5px rgba(145,145,145,0.09);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .pixel-heart {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 271px; height: 241px; z-index: 0; pointer-events: none;
  }
  textarea.message {
    position: relative; z-index: 1; font-family: "Gasoek One", sans-serif;
    font-size: 36px; line-height: 1.1; color: #703E94; text-align: center;
    max-width: 100%; width: 100%; height: 44px; max-height: 100%; resize: none; border: none;
    outline: none; background: transparent; padding: 0; margin: 0; overflow: hidden;
  }
  textarea.message::placeholder { color: #A886BF; opacity: 1; }
  .pill {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 2; display: flex; align-items: center; gap: 8px;
    background: white; border-radius: 100px; padding: 4px 10px 4px 4px;
    box-shadow: 0 4px 15px rgba(210,210,210,0.35); white-space: nowrap;
  }
  .pill .avatar {
    width: 32px; height: 32px; border-radius: 100px; overflow: hidden;
    background: var(--card-border); flex-shrink: 0;
  }
  .pill .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pill .name { font-size: 18px; color: #101010; font-family: -apple-system, sans-serif; }

  .updated {
    font-family: "Geist", sans-serif; font-weight: 500; font-size: 16px;
    color: rgba(255,255,255,0.8); text-align: center; width: 100%; margin: 0;
    min-height: 24px;
  }

  .buttons {
    display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 375px;
    box-sizing: border-box; padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px 24px; border-radius: 12px; font-size: 16px;
    font-weight: 500; font-family: "Geist", sans-serif;
    cursor: pointer; border: none; box-sizing: border-box;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  /* Matches the Button component's Type=Primar states (node 13:260) */
  .btn-primary { background: #ffffff; color: #703e94; }
  .btn-primary:hover { background: #f7f2ff; }
  .btn-primary:active { background: #ede5fa; color: rgba(112,62,148,0.8); }
  .btn-primary:disabled { background: rgba(255,255,255,0.8); color: rgba(112,62,148,0.4); cursor: default; }
  /* Matches the Button component's Type=Secondary states */
  .btn-secondary { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.25); }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.6); }
  .btn-secondary:active { background: rgba(0,0,0,0.08); border-color: rgba(255,255,255,0.3); }
  .btn-secondary:disabled { color: rgba(255,255,255,0.35); border-color: rgba(255,255,255,0.1); cursor: default; }
</style>
</head>
<body>
<div class="device">
  <div class="bg">
    <img src="Background.png" alt="">
    <div class="blur"></div>
  </div>

  <div class="content">
    <h1 class="heading">Schreib ihm eine Nachricht</h1>
    <div class="card">
      <img class="pixel-heart" src="pixel heart.png" alt="">
      <textarea class="message" id="input" placeholder="Schreib ihm etwas" maxlength="120"></textarea>
      <div class="pill">
        <div class="avatar"><img src="avatar.png" alt=""></div>
        <span class="name">Ich</span>
      </div>
    </div>
    <p class="updated" id="updatedText"></p>
  </div>

  <div class="buttons">
    <button class="btn btn-primary" id="sendBtn">Senden</button>
  </div>
</div>

<script>
/* ---- Backend: Firebase Realtime Database (dieselbe URL wie in
   frommetoyou.html). Speichert die Nachrichten direkt unter /messages.json ---- */
var JSONBLOB_URL = "https://frommetoyou-note-33974-default-rtdb.europe-west1.firebasedatabase.app/messages.json";

var input = document.getElementById("input");
var sendBtn = document.getElementById("sendBtn");
var updatedText = document.getElementById("updatedText");
var messages = [];
var ready = false;

/* Auto-grow the textarea to fit its content, so it starts as one
   centered line and expands (staying centered via the card's flex
   centering) as more lines are typed, instead of being pinned to the
   top of a fixed-height box. */
function autoResize() {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
}
input.addEventListener("input", autoResize);
window.addEventListener("load", autoResize);
autoResize();

/* Senden is disabled whenever there's no text typed (the placeholder
   state) and enables itself the moment a first character lands.
   This is independent of whether the jsonblob store has finished
   loading — that's checked separately, at send-time, in the click
   handler below (so the button never looks "stuck" just because the
   store hasn't loaded yet). */
function updateSendButton() {
  sendBtn.disabled = !input.value.trim();
}
input.addEventListener("input", updateSendButton);
updateSendButton();

/* Placeholder hides the instant you tap in (not just once you start
   typing) — leaves a clean blinking cursor. Comes back only if you
   tap away again without having typed anything. */
var PLACEHOLDER_TEXT = input.getAttribute("placeholder");
input.addEventListener("focus", function () {
  input.setAttribute("placeholder", "");
});
input.addEventListener("blur", function () {
  if (!input.value) input.setAttribute("placeholder", PLACEHOLDER_TEXT);
});

function timeAgo(dateStr) {
  var then = new Date(dateStr).getTime();
  var diffMs = Date.now() - then;
  if (isNaN(then) || diffMs < 0) return "gerade eben";
  var mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "gerade eben";
  if (mins < 60) return "vor " + mins + (mins === 1 ? " Minute" : " Minuten");
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return "vor " + hrs + (hrs === 1 ? " Stunde" : " Stunden");
  var days = Math.floor(hrs / 24);
  return "vor " + days + (days === 1 ? " Tag" : " Tagen");
}

function fmtDateDE(dateStr) {
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
}

function setUpdatedFrom(dateStr) {
  if (!dateStr) { updatedText.textContent = ""; return; }
  updatedText.textContent = "Zuletzt aktualisiert: " + fmtDateDE(dateStr) + " (" + timeAgo(dateStr) + ")";
}

if (!JSONBLOB_URL || JSONBLOB_URL.indexOf("PASTE_YOUR") !== -1) {
  updatedText.textContent = "Noch nicht eingerichtet — siehe Kommentar oben im Code dieser Datei.";
} else {
  updatedText.textContent = "Lädt...";
  fetch(JSONBLOB_URL, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (data) {
      messages = data || [];
      ready = true;
      updateSendButton();
      var latest = messages[0];
      setUpdatedFrom(latest ? latest.date : null);
    })
    .catch(function () {
      updatedText.textContent = "Nachrichten konnten nicht geladen werden — prüfe deine Verbindung und lade neu.";
    });
}

sendBtn.addEventListener("click", function () {
  var text = input.value.trim();
  if (!text) return;
  if (!ready) {
    updatedText.textContent = "Noch nicht eingerichtet — siehe Kommentar oben im Code dieser Datei.";
    return;
  }
  sendBtn.disabled = true;
  updatedText.textContent = "Wird gesendet...";
  var newMessages = [{ text: text, date: new Date().toISOString() }].concat(messages);
  fetch(JSONBLOB_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(newMessages)
  })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function () {
      messages = newMessages;
      input.value = "";
      autoResize();
      setUpdatedFrom(newMessages[0].date);
      updateSendButton();
    })
    .catch(function () {
      updatedText.textContent = "Senden fehlgeschlagen — prüfe deine Verbindung und versuch es nochmal.";
      updateSendButton();
    });
});
</script>
</body>
</html>
